version: '3.8'

services:
  ghost-hunter-kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: ghost-identity-hunter:kalilinux
    container_name: ghost-hunter-kali
    restart: unless-stopped
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - GHOST_HUNTER_DB_PATH=/home/ghosthunter/.ghost_hunter/investigations.db
      - PYTHONPATH=/app
    
    # Volume mounts for persistent data
    volumes:
      # Database and configuration
      - ghost_hunter_data:/home/ghosthunter/.ghost_hunter
      # Investigation results and reports
      - ./investigations:/app/investigations
      - ./reports:/app/reports
      # Optional: Mount custom tool configurations
      # - ./config:/app/config
    
    # Network configuration
    networks:
      - ghost_hunter_net
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem (optional, for enhanced security)
    # read_only: true
    # tmpfs:
    #   - /tmp
    
    # Interactive shell access
    stdin_open: true
    tty: true

networks:
  ghost_hunter_net:
    driver: bridge

volumes:
  ghost_hunter_data:
    driver: local

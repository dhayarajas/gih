version: '3.8'

services:
  ghost-hunter-kali:
    build:
      context: ..
      dockerfile: Dockerfile.kali
    image: ghost-identity-hunter:kalilinux
    container_name: ghost-hunter-kali
    restart: unless-stopped
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - GHOST_HUNTER_DB_PATH=/home/ghosthunter/.ghost_hunter/investigations.db
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ghosthunter_password
      - USE_NEO4J=true
    
    # Volume mounts for persistent data
    volumes:
      # Database and configuration
      - ghost_hunter_data:/home/ghosthunter/.ghost_hunter
      # Investigation results and reports
      - ../investigations:/app/investigations
      - ../reports:/app/reports
      # Optional: Mount custom tool configurations
      # - ./config:/app/config
    
    # Network configuration
    networks:
      - ghost_hunter_net
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem (optional, for enhanced security)
    # read_only: true
    # tmpfs:
    #   - /tmp
    
    # Interactive shell access
    stdin_open: true
    tty: true
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.15.0-community
    container_name: ghost-hunter-neo4j
    restart: unless-stopped
    
    # Environment variables
    environment:
      - NEO4J_AUTH=neo4j/ghosthunter_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    
    # Volume mounts for Neo4j data
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    
    # Network configuration
    networks:
      - ghost_hunter_net
    
    # Port mappings (optional, for external access)
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  ghost_hunter_net:
    driver: bridge

volumes:
  ghost_hunter_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

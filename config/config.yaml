# Orchestrator Settings
orchestrator:
  bfs_batch_size: 10  # Number of artifacts to process in parallel
  max_depth: 2  # Maximum recursion depth for artifact discovery
  # BFS-level artifact concurrency (falls back to plugin_settings if unset).
  max_parallel_workers: 15

